<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Tech Container -->
  <rect x="5" y="5" width="90" height="90" rx="24" fill="#0F172A" stroke="url(#borderGrad)" stroke-width="3" stroke-opacity="0.85"/>
  <rect x="10" y="10" width="80" height="80" rx="19" fill="#0B0F19" fill-opacity="0.6"/>
  
  <!-- Subtle Code Brackets -->
  <path d="M 28 38 L 20 50 L 28 62" stroke="#0EA5E9" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
  <path d="M 72 38 L 80 50 L 72 62" stroke="#0EA5E9" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
  
  <!-- Monogram Letter A -->
  <text x="46" y="62" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="42" fill="url(#brandGrad)" text-anchor="middle" filter="url(#logoGlow)">A</text>
  
  <!-- Brand Accent Dot (Coral) -->
  <circle cx="66" cy="57" r="5" fill="#FF6B4A" filter="url(#logoGlow)"/>
</svg>
