    <!-- Main Content Area -->
    <!-- Top KPI Cards -->
    <g transform="translate(196, 62)">
      <rect width="145" height="74" rx="8" fill="#161F30" stroke="#1E293B"/>
      <text x="14" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94A3B8">Verified Clinics</text>
      <text x="14" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#F8FAFC">24/7</text>
      <path d="M14 60 L40 54 L70 58 L100 50 L130 52" stroke="#10B981" stroke-width="2" fill="none"/>

      <rect x="157" width="145" height="74" rx="8" fill="#161F30" stroke="#1E293B"/>
      <text x="171" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94A3B8">Appointment Flow</text>
      <text x="171" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#38BDF8">Fast &amp; Direct</text>
