      <circle cx="36" cy="139" r="10" fill="#3B82F6"/>
      <text x="32" y="143" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#FFF">P2</text>
      <text x="54" y="136" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#F1F5F9">Patient #DX-109</text>
      <text x="54" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#94A3B8">Cardiology Check</text>
      <text x="140" y="136" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#E2E8F0">Dr. Hassan Farah</text>
      <text x="140" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#06B6D4">Cardiologist</text>
      <text x="280" y="136" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#CBD5E1">Tomorrow, 02:00 PM</text>
      <rect x="380" y="128" width="56" height="20" rx="10" fill="#F59E0B" fill-opacity="0.15"/>
      <text x="394" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" fill="#FBBF24">Pending</text>

      <!-- Row 3 -->
      <rect x="16" y="166" width="432" height="42" rx="4" fill="#111827" fill-opacity="0.6"/>
      <circle cx="36" cy="187" r="10" fill="#8B5CF6"/>
      <text x="32" y="191" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#FFF">P3</text>
      <text x="54" y="184" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#F1F5F9">Patient #DX-115</text>
      <text x="54" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#94A3B8">Pediatric Visit</text>
      <text x="140" y="184" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#E2E8F0">Dr. Zahra Jama</text>
      <text x="140" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#06B6D4">Pediatrics</text>
      <text x="280" y="184" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#CBD5E1">Friday, 11:15 AM</text>
      <rect x="380" y="176" width="56" height="20" rx="10" fill="#10B981" fill-opacity="0.15"/>
      <text x="390" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" fill="#34D399">Confirmed</text>

      <!-- Bottom action button -->
