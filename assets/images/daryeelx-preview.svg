<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#090E1A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="glowD" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="500" rx="16" fill="url(#bgGradD)"/>
  <circle cx="680" cy="100" r="140" fill="#0D9488" opacity="0.18" filter="url(#glowD)"/>
  <circle cx="120" cy="400" r="120" fill="#3B82F6" opacity="0.15" filter="url(#glowD)"/>

  <!-- Subtle Grid -->
  <path d="M0 100 H800 M0 200 H800 M0 300 H800 M0 400 H800 M160 0 V500 M320 0 V500 M480 0 V500 M640 0 V500" stroke="#334155" stroke-opacity="0.15" stroke-width="1"/>

  <!-- Main App Window Frame -->
  <g transform="translate(60, 45)">
    <!-- Window Container -->
    <rect width="680" height="410" rx="12" fill="#111827" stroke="#1F2937" stroke-width="1.5"/>
    
    <!-- App Header Bar -->
    <rect width="680" height="46" rx="12" fill="#1E293B"/>
    <rect y="36" width="680" height="10" fill="#1E293B"/>
    <circle cx="24" cy="23" r="5" fill="#EF4444"/>
    <circle cx="42" cy="23" r="5" fill="#F59E0B"/>
    <circle cx="60" cy="23" r="5" fill="#10B981"/>

    <!-- App Title & Breadcrumbs -->
    <rect x="90" y="14" width="130" height="18" rx="4" fill="#0D9488" fill-opacity="0.2"/>
    <text x="100" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#14B8A6">eBallan DARYEELX</text>
    
    <rect x="520" y="14" width="136" height="18" rx="9" fill="#10B981" fill-opacity="0.15"/>
    <circle cx="532" cy="23" r="3.5" fill="#10B981"/>
    <text x="542" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#34D399">In Development</text>

    <!-- Sidebar Column -->
    <rect x="18" y="62" width="160" height="332" rx="8" fill="#161F30"/>
    <rect x="32" y="80" width="80" height="10" rx="3" fill="#64748B"/>
    
    <!-- Active Nav Item -->
    <rect x="26" y="105" width="144" height="32" rx="6" fill="#0D9488" fill-opacity="0.25"/>
    <circle cx="42" cy="121" r="5" fill="#14B8A6"/>
    <rect x="56" y="117" width="80" height="8" rx="3" fill="#E2E8F0"/>
    
    <!-- Other Nav Items -->
    <circle cx="42" cy="155" r="5" fill="#475569"/>
    <rect x="56" y="151" width="70" height="8" rx="3" fill="#475569"/>
    
    <circle cx="42" cy="189" r="5" fill="#475569"/>
    <rect x="56" y="185" width="85" height="8" rx="3" fill="#475569"/>
    
    <circle cx="42" cy="223" r="5" fill="#475569"/>
