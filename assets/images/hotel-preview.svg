<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#0C1222"/>
      <stop offset="100%" stop-color="#050814"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <filter id="glowH" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#bgGradH)"/>
  <circle cx="700" cy="120" r="130" fill="#3B82F6" opacity="0.15" filter="url(#glowH)"/>
  <circle cx="100" cy="380" r="110" fill="#F59E0B" opacity="0.12" filter="url(#glowH)"/>

  <!-- Window Container -->
  <g transform="translate(60, 45)">
    <rect width="680" height="410" rx="12" fill="#111827" stroke="#1F2937" stroke-width="1.5"/>
    
    <!-- App Header Bar -->
    <rect width="680" height="46" rx="12" fill="#1E293B"/>
    <rect y="36" width="680" height="10" fill="#1E293B"/>
    <circle cx="24" cy="23" r="5" fill="#EF4444"/>
    <circle cx="42" cy="23" r="5" fill="#F59E0B"/>
    <circle cx="60" cy="23" r="5" fill="#10B981"/>

    <!-- App Title -->
    <rect x="90" y="14" width="165" height="18" rx="4" fill="#3B82F6" fill-opacity="0.2"/>
    <text x="100" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#60A5FA">HOTEL MANAGEMENT SYSTEM</text>
    
    <rect x="530" y="14" width="126" height="18" rx="9" fill="#F59E0B" fill-opacity="0.15"/>
    <circle cx="542" cy="23" r="3.5" fill="#F59E0B"/>
    <text x="552" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#FBBF24">University Project</text>

    <!-- Sidebar Column -->
    <rect x="18" y="62" width="150" height="332" rx="8" fill="#161F30"/>
    <rect x="30" y="78" width="70" height="8" rx="3" fill="#64748B"/>
    
    <rect x="24" y="100" width="138" height="30" rx="6" fill="#3B82F6" fill-opacity="0.25"/>
    <text x="40" y="119" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#93C5FD">Dashboard</text>
    
    <text x="40" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94A3B8">Rooms &amp; Suites</text>
    <text x="40" y="184" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94A3B8">Guests &amp; Check-in</text>
    <text x="40" y="216" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94A3B8">Bookings</text>
    <text x="40" y="248" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#94A3B8">Payments &amp; Bills</text>

    <rect x="24" y="315" width="138" height="65" rx="6" fill="#0F172A" stroke="#334155" stroke-opacity="0.5"/>
    <text x="34" y="334" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#94A3B8">Tech Stack</text>
    <text x="34" y="352" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#38BDF8">PHP + MySQL</text>
    <text x="34" y="368" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#64748B">HTML, CSS, JS</text>

