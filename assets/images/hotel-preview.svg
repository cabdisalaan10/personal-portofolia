        <rect width="474" height="248" rx="8" fill="#161F30" stroke="#1E293B"/>
        <text x="16" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#E2E8F0">Room Inventory &amp; Status Matrix</text>

