        <text x="28" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#F8FAFC">Room 101</text>
        <rect x="94" y="50" width="52" height="16" rx="8" fill="#10B981" fill-opacity="0.15"/>
        <text x="102" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#34D399">OCCUPIED</text>
        <text x="28" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#94A3B8">Deluxe Suite • King</text>
        <text x="28" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#64748B">Guest: Ahmed K.</text>
        <text x="28" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#38BDF8">$120/night</text>

        <!-- Room 102 -->
        <rect x="166" y="42" width="140" height="92" rx="6" fill="#0F172A" stroke="#334155" stroke-opacity="0.6"/>
        <text x="178" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#F8FAFC">Room 102</text>
        <rect x="244" y="50" width="52" height="16" rx="8" fill="#3B82F6" fill-opacity="0.15"/>
        <text x="252" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#60A5FA">AVAILABLE</text>
        <text x="178" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#94A3B8">Standard Double</text>
        <text x="178" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#64748B">Cleaned &amp; Ready</text>
        <text x="178" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#38BDF8">$80/night</text>

        <!-- Room 103 -->
        <rect x="316" y="42" width="142" height="92" rx="6" fill="#0F172A" stroke="#334155" stroke-opacity="0.6"/>
        <text x="328" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#F8FAFC">Room 103</text>
        <rect x="396" y="50" width="52" height="16" rx="8" fill="#EF4444" fill-opacity="0.15"/>
        <text x="404" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="700" fill="#F87171">CLEANING</text>
        <text x="328" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#94A3B8">Executive Suite</text>
        <text x="328" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#64748B">Housekeeping in prog.</text>
        <text x="328" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#38BDF8">$150/night</text>

        <!-- Quick Terminal / Operations Bar -->
        <g transform="translate(16, 146)">
          <rect width="442" height="90" rx="6" fill="#0B0F19" stroke="#1E293B"/>
          <text x="14" y="20" font-family="Consolas, monospace" font-size="10" fill="#64748B">// System Log &amp; Authentication Flow</text>
          <text x="14" y="38" font-family="Consolas, monospace" font-size="10" fill="#34D399">&gt; [AUTH] Admin session verified via secure PHP session hash</text>
          <text x="14" y="54" font-family="Consolas, monospace" font-size="10" fill="#38BDF8">&gt; [SQL] SELECT * FROM bookings WHERE status = 'confirmed' LIMIT 10</text>
          <text x="14" y="70" font-family="Consolas, monospace" font-size="10" fill="#94A3B8">&gt; [PAYMENT] Transaction ID #TX-9821 logged successfully</text>
        </g>
      </g>
