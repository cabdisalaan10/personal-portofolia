<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradP" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#0A101D"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="blueG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="glowP" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#bgGradP)"/>
  <circle cx="680" cy="140" r="140" fill="#6366F1" opacity="0.16" filter="url(#glowP)"/>
  <circle cx="120" cy="380" r="120" fill="#06B6D4" opacity="0.14" filter="url(#glowP)"/>

  <!-- Browser Frame -->
  <g transform="translate(60, 45)">
    <rect width="680" height="410" rx="12" fill="#111827" stroke="#1F2937" stroke-width="1.5"/>
    
    <!-- Top URL Bar -->
    <rect width="680" height="46" rx="12" fill="#1E293B"/>
    <rect y="36" width="680" height="10" fill="#1E293B"/>
    <circle cx="24" cy="23" r="5" fill="#EF4444"/>
    <circle cx="42" cy="23" r="5" fill="#F59E0B"/>
    <circle cx="60" cy="23" r="5" fill="#10B981"/>

    <!-- URL Box -->
    <rect x="90" y="12" width="480" height="22" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <circle cx="106" cy="23" r="4" fill="#10B981"/>
    <text x="118" y="27" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#E2E8F0">https://abdis.ink</text>
    
    <!-- Theme Toggle Pill Preview -->
    <rect x="600" y="14" width="55" height="18" rx="9" fill="#334155"/>
    <circle cx="612" cy="23" r="6" fill="#F8FAFC"/>
    <circle cx="642" cy="23" r="5" fill="#F59E0B"/>

    <!-- Portfolio UI Preview Canvas -->
    <g transform="translate(20, 60)">
      <!-- Mini Hero Card -->
      <rect width="420" height="200" rx="8" fill="#161F30" stroke="#1E293B"/>
      
      <!-- Greeting & Badge -->
      <rect x="20" y="20" width="100" height="18" rx="4" fill="#3B82F6" fill-opacity="0.2"/>
      <text x="26" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#60A5FA">HELLO, WORLD</text>
      
      <text x="20" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#F8FAFC">Abdisalam Faysal Ali</text>
      <text x="20" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#38BDF8">Software Developer &amp; DaryeelX Founder</text>
      
      <text x="20" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#94A3B8">Building practical digital products, healthtech concepts,</text>
      <text x="20" y="127" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#94A3B8">and scalable web applications with clean architecture.</text>

      <rect x="20" y="150" width="115" height="28" rx="6" fill="url(#blueG)"/>
      <text x="32" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#FFFFFF">View Projects</text>

      <rect x="145" y="150" width="115" height="28" rx="6" fill="#1E293B" stroke="#334155"/>
      <text x="160" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" fill="#E2E8F0">DaryeelX Story</text>

      <!-- Audit & Quality Card -->
      <g transform="translate(436, 0)">
        <rect width="204" height="200" rx="8" fill="#161F30" stroke="#1E293B"/>
        <text x="16" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#E2E8F0">Core Web Vitals</text>

        <!-- Circular Score 1: Perf -->
        <circle cx="50" cy="70" r="24" fill="#0F172A" stroke="#10B981" stroke-width="4"/>
        <text x="38" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#10B981">100</text>
        <text x="28" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#94A3B8">Performance</text>

        <!-- Circular Score 2: A11y -->
        <circle cx="140" cy="70" r="24" fill="#0F172A" stroke="#10B981" stroke-width="4"/>
        <text x="128" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#10B981">100</text>
        <text x="114" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#94A3B8">Accessibility</text>

        <rect x="16" y="130" width="172" height="54" rx="6" fill="#0F172A" stroke="#334155" stroke-opacity="0.6"/>
        <text x="26" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" fill="#94A3B8">Speed &amp; Footprint</text>
        <text x="26" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#34D399">Zero Bloat • Vanilla</text>
      </g>

      <!-- Bottom Architecture Bar -->
      <g transform="translate(0, 212)">
        <rect width="640" height="120" rx="8" fill="#0B0F19" stroke="#1E293B"/>
        <text x="16" y="24" font-family="Consolas, monospace" font-size="11" font-weight="700" fill="#60A5FA">// data.js — Centralized Single Source of Truth</text>
        <text x="16" y="45" font-family="Consolas, monospace" font-size="10" fill="#E2E8F0"><tspan fill="#F43F5E">const</tspan> portfolioData = {</text>
        <text x="32" y="63" font-family="Consolas, monospace" font-size="10" fill="#E2E8F0">name: <tspan fill="#34D399">"Abdisalam Faysal Ali"</tspan>, venture: <tspan fill="#34D399">"DaryeelX"</tspan>,</text>
        <text x="32" y="81" font-family="Consolas, monospace" font-size="10" fill="#E2E8F0">domain: <tspan fill="#38BDF8">"abdis.ink"</tspan>, education: <tspan fill="#FBBF24">"Golis University"</tspan></text>
        <text x="16" y="99" font-family="Consolas, monospace" font-size="10" fill="#E2E8F0">}; <tspan fill="#64748B">// Fast, clean, reactive hydration</tspan></text>
      </g>
    </g>
  </g>
</svg>
